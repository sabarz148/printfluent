name: Sync Etsy listings, build site, back up
on:
  schedule: [{cron: "17 3 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pillow
      - name: Pull listings, photos, videos, descriptions from Etsy
        env: {ETSY_API_KEY: "${{ secrets.ETSY_API_KEY }}"}
        run: python3 scripts/sync_etsy.py
      - run: python3 build.py
      - name: Save everything to the repo (this is also your backup)
        run: |
          git config user.name "printfluent-bot"; git config user.email "bot@users.noreply.github.com"
          git add data src/assets/products backup
          git diff --cached --quiet || (git commit -m "Sync Etsy listings" && git push)
      - uses: actions/upload-artifact@v4
        with: {name: dist-ready-to-deploy, path: dist}
      - uses: actions/upload-artifact@v4
        with: {name: backup-photos-videos-csv, path: |
            src/assets/products
            backup
            data}
